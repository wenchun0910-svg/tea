<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和風茶屋 - 飲料訂購系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matcha: { DEFAULT: '#8a9a5b', light: '#a3b176', dark: '#6b7942' },
                        wood: { DEFAULT: '#d2b48c', dark: '#a68a64' },
                        paper: { DEFAULT: '#fdfbf7', dark: '#f4f0ea' },
                        ink: { DEFAULT: '#2c3e50', light: '#4a5568' }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif JP"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fdfbf7; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%238a9a5b' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-fade { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #8a9a5b; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-ink antialiased">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50 border-b-4 border-matcha">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('customer')">
                <div class="w-10 h-10 bg-matcha rounded-full flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1 id="site-name-display" class="text-2xl font-bold font-serif text-matcha-dark hidden sm:block">和風茶屋</h1>
            </div>
            
            <div id="nav-customer-controls" class="flex items-center gap-4 flex-1 justify-end">
                <button onclick="toggleCart()" class="relative text-ink hover:text-matcha transition p-2">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute top-0 right-0 -mt-1 -mr-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                </button>
                <button onclick="openLoginModal()" id="btn-login" class="text-sm border border-matcha text-matcha px-3 py-1.5 rounded hover:bg-matcha hover:text-white transition">管理登入</button>
            </div>

            <div id="nav-admin-controls" class="hidden items-center gap-4">
                <span id="admin-user-name" class="text-sm text-gray-600 font-bold"></span>
                <button onclick="logoutAdmin()" class="text-sm border border-red-400 text-red-500 px-3 py-1.5 rounded hover:bg-red-50 hover:text-red-600 transition">登出</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main id="app-container" class="max-w-6xl mx-auto px-4 py-8 min-h-[calc(100vh-140px)]"></main>

    <!-- Footer -->
    <footer class="bg-ink text-paper text-center py-6 mt-auto">
        <p class="text-sm">&copy; <span id="current-year"></span> <span id="footer-site-name">和風茶屋</span>訂購系統. All rights reserved.</p>
    </footer>

    <!-- Global Modal -->
    <div id="global-modal" class="fixed inset-0 z-[60] hidden flex-col items-center justify-center">
        <div class="absolute inset-0 bg-black bg-opacity-60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white rounded-lg shadow-2xl z-10 w-11/12 max-w-lg overflow-hidden modal-fade relative flex flex-col max-h-[90vh]">
            <div id="modal-header" class="px-6 py-4 border-b flex justify-between items-center bg-matcha text-white shrink-0">
                <h3 id="modal-title" class="text-lg font-bold font-serif">提示</h3>
                <button onclick="closeModal()" class="hover:text-gray-200 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modal-body" class="px-6 py-6 text-ink overflow-y-auto no-scrollbar grow">
                <!-- 訊息內容 -->
            </div>
            <div id="modal-footer" class="px-6 py-4 bg-paper flex justify-end gap-3 border-t shrink-0">
                <button id="modal-cancel-btn" onclick="closeModal()" class="px-4 py-2 border border-gray-300 text-gray-600 rounded hover:bg-gray-100 hidden transition">取消</button>
                <button id="modal-confirm-btn" class="px-4 py-2 bg-matcha text-white rounded hover:bg-matcha-dark transition shadow">確定</button>
            </div>
        </div>
    </div>

    <!-- Shopping Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="px-6 py-4 border-b bg-matcha text-white flex justify-between items-center">
            <h2 class="text-xl font-bold font-serif"><i class="fa-solid fa-basket-shopping mr-2"></i>購物車</h2>
            <button onclick="toggleCart()" class="text-white hover:text-gray-200 text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4 bg-paper">
            <!-- 購物車品項 -->
        </div>
        <div class="border-t p-6 bg-white">
            <div class="flex justify-between items-center mb-4 text-lg font-bold text-ink">
                <span>總計:</span>
                <span id="cart-total" class="text-matcha-dark text-2xl">$0</span>
            </div>
            <div class="space-y-3">
                <input type="text" id="order-customer-name" placeholder="您的姓名 / 暱稱" class="w-full border p-3 rounded focus:outline-none focus:border-matcha bg-gray-50">
                <input type="text" id="order-customer-notes" placeholder="備註 (如：統一編號...)" class="w-full border p-3 rounded focus:outline-none focus:border-matcha bg-gray-50">
                <button onclick="submitOrder()" class="w-full bg-matcha text-white font-bold py-3 rounded shadow hover:bg-matcha-dark transition text-lg flex justify-center items-center gap-2">
                    <i class="fa-regular fa-paper-plane"></i> 送出訂單
                </button>
            </div>
        </div>
    </div>
    <!-- Cart Overlay -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden backdrop-blur-sm"></div>

    <!-- AI Scan Hidden File Input -->
    <input type="file" id="ai-menu-upload" accept="image/*" class="hidden" onchange="processMenuImage(event)">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-matcha font-bold font-serif">系統載入中...</p>
    </div>

    <!-- Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDocs, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. Firebase Initialization & Config
        // ==========================================
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock-key", authDomain: "mock.firebaseapp.com", projectId: "mock-project"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wafu-tea-demo';

        const PATH_SHOPS = `artifacts/${appId}/public/data/shops`;
        const PATH_MENUS = `artifacts/${appId}/public/data/menus`;
        const PATH_ORDERS = `artifacts/${appId}/public/data/orders`;
        const PATH_ADMINS = `artifacts/${appId}/public/data/admins`;
        const PATH_SETTINGS = `artifacts/${appId}/public/data/settings`;
        const PATH_CAMPAIGN_HISTORY = `artifacts/${appId}/public/data/campaignHistory`;

        // ==========================================
        // 2. State Management
        // ==========================================
        const state = {
            shops: [],
            menus: [],
            orders: [],
            admins: [],
            cart: [],
            adminUser: null,
            currentAdminTab: 'campaign', // 預設跳到任務管理
            siteName: '和風茶屋',
            orderFilterShopId: 'all',
            orderFilterStartDate: '',
            orderFilterEndDate: '',
            orderCurrentPage: 1,
            campaign: { isActive: false, activeShopId: '', title: '本日訂購任務' },
            campaignHistory: [] // 新增歷史紀錄狀態
        };

        // ==========================================
        // 3. Application Initialization & Auth
        // ==========================================
        document.getElementById('current-year').textContent = new Date().getFullYear();

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                hideLoading();
                showModal('連線錯誤', '無法連接資料庫，請重新整理頁面。');
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await setupDataListeners();
                checkInitialAdmin();
            }
        });

        initAuth(); // 啟動驗證

        // ==========================================
        // 4. Data Listeners (Firestore Realtime)
        // ==========================================
        async function setupDataListeners() {
            onSnapshot(collection(db, PATH_SHOPS), (snapshot) => {
                state.shops = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                reRenderCurrentView();
            }, (error) => console.error("Error fetching shops:", error));

            onSnapshot(collection(db, PATH_MENUS), (snapshot) => {
                state.menus = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                reRenderCurrentView();
            }, (error) => console.error("Error fetching menus:", error));

            onSnapshot(collection(db, PATH_ORDERS), (snapshot) => {
                state.orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                state.orders.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                reRenderCurrentView();
            }, (error) => console.error("Error fetching orders:", error));

            onSnapshot(collection(db, PATH_ADMINS), (snapshot) => {
                state.admins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                reRenderCurrentView();
            }, (error) => console.error("Error fetching admins:", error));

            onSnapshot(doc(db, PATH_SETTINGS, 'general'), (docSnap) => {
                if (docSnap.exists() && docSnap.data().name) {
                    state.siteName = docSnap.data().name;
                } else {
                    state.siteName = '和風茶屋';
                }
                document.title = `${state.siteName} - 飲料訂購系統`;
                const navName = document.getElementById('site-name-display');
                if (navName) navName.textContent = state.siteName;
                const footerName = document.getElementById('footer-site-name');
                if (footerName) footerName.textContent = state.siteName;
            }, (error) => console.error("Error fetching settings:", error));

            // 監聽當前訂購任務
            onSnapshot(doc(db, PATH_SETTINGS, 'campaign'), (docSnap) => {
                if (docSnap.exists()) {
                    state.campaign = docSnap.data();
                } else {
                    state.campaign = { isActive: false, activeShopId: '', title: '本日訂購任務' };
                }
                reRenderCurrentView();
            }, (error) => console.error("Error fetching campaign:", error));

            // 監聽歷史任務紀錄
            onSnapshot(collection(db, PATH_CAMPAIGN_HISTORY), (snapshot) => {
                state.campaignHistory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // 依照結束時間新到舊排序
                state.campaignHistory.sort((a, b) => {
                    const timeA = a.endedAt?.toMillis ? a.endedAt.toMillis() : 0;
                    const timeB = b.endedAt?.toMillis ? b.endedAt.toMillis() : 0;
                    return timeB - timeA;
                });
                reRenderCurrentView();
            }, (error) => console.error("Error fetching campaign history:", error));

            setTimeout(hideLoading, 1000);
        }

        async function checkInitialAdmin() {
            const adminCol = collection(db, PATH_ADMINS);
            const snapshot = await getDocs(adminCol);
            if (snapshot.empty) {
                await addDoc(adminCol, { username: 'admin', password: 'admin123', role: 'super_admin', createdAt: serverTimestamp() });
            }
        }

        // ==========================================
        // 5. Core UI Functions
        // ==========================================
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

        function reRenderCurrentView() {
            if (state.adminUser) renderAdminDashboard();
            else renderCustomerView();
        }

        window.switchView = (view) => {
            if (view === 'customer') {
                if (state.adminUser) showModal('提示', '您目前正在後台管理模式。要返回顧客點餐畫面，請先登出。');
                else renderCustomerView();
            }
        };

        // ==========================================
        // 6. Customer View Logic
        // ==========================================
        function renderCustomerView() {
            const container = document.getElementById('app-container');
            document.getElementById('nav-customer-controls').classList.replace('hidden', 'flex');
            document.getElementById('nav-admin-controls').classList.replace('flex', 'hidden');

            if (!state.campaign || !state.campaign.isActive || !state.campaign.activeShopId) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <i class="fa-solid fa-mug-hot text-6xl text-gray-300 mb-4"></i>
                        <h2 class="text-2xl font-serif font-bold text-gray-500">目前尚無開放的訂購任務</h2>
                        <p class="mt-2 text-gray-400">請等待管理員發起新的飲料訂購，或稍後再回來查看。</p>
                    </div>`;
                return;
            }

            const currentShop = state.shops.find(s => s.id === state.campaign.activeShopId);
            if (!currentShop) {
                container.innerHTML = `<div class="text-center py-20"><p class="text-red-500">找不到任務指定的店家資料，請聯絡管理員。</p></div>`;
                return;
            }

            const shopMenus = state.menus.filter(m => m.shopId === currentShop.id && m.isAvailable !== false);
            
            const categories = {};
            shopMenus.forEach(item => {
                const cat = item.category || '精選飲品';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let html = `
                <div class="mb-8 text-center sm:text-left">
                    <div class="inline-block bg-matcha text-white px-3 py-1 rounded-full text-sm font-bold mb-3"><i class="fa-solid fa-bullhorn"></i> 當前任務：${state.campaign.title}</div>
                    <h2 class="text-3xl font-bold font-serif text-ink border-b-2 border-matcha inline-block pb-2 block sm:inline-block sm:ml-3">${currentShop.name}</h2>
                    ${currentShop.description ? `<p class="mt-3 text-gray-600 bg-white p-4 rounded shadow-sm border-l-4 border-wood">${currentShop.description}</p>` : ''}
                </div>
            `;

            let actionButtonsHtml = `<div class="mb-8 flex flex-wrap justify-center sm:justify-start gap-3 items-center">`;

            if (currentShop.menuImageUrl) {
                const url = currentShop.menuImageUrl;
                const isImg = url.match(/\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i) || url.startsWith('data:image') || url.includes('alt=media');
                
                if (isImg) {
                    html += `
                        <div class="mb-10 bg-white p-2 rounded shadow-md">
                            <div class="bg-gray-100 text-center text-sm py-1 mb-2 text-gray-500 rounded">實體菜單參考</div>
                            <img src="${url}" alt="${currentShop.name} 菜單" class="w-full max-h-96 object-contain rounded cursor-pointer" onclick="showImageModal('${url}')" onerror="this.style.display='none'">
                        </div>
                    `;
                } else {
                    actionButtonsHtml += `
                        <a href="${url}" target="_blank" class="inline-block bg-white border border-matcha text-matcha px-4 py-2 rounded shadow-sm hover:bg-matcha hover:text-white transition font-bold">
                            <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> 前往查看店家菜單網站
                        </a>
                    `;
                }
            }

            const currentCampaignOrders = state.orders.filter(o => o.campaignTitle === state.campaign.title && o.shopId === state.campaign.activeShopId);
            actionButtonsHtml += `
                <button onclick="showCampaignOrdersModal()" class="inline-block bg-wood text-white px-4 py-2 rounded shadow-sm hover:bg-wood-dark transition font-bold">
                    <i class="fa-solid fa-clipboard-list mr-2"></i> 查看本團訂購進度 (${currentCampaignOrders.length})
                </button>
            `;
            actionButtonsHtml += `</div>`;
            
            html += actionButtonsHtml;

            if (shopMenus.length === 0) {
                html += `<div class="text-center py-10 text-gray-500">此店家尚未新增飲品。</div>`;
            } else {
                for (const [cat, items] of Object.entries(categories)) {
                    html += `
                        <div class="mb-8">
                            <h3 class="text-xl font-bold font-serif text-wood-dark mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-leaf text-matcha"></i> ${cat}
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    `;
                    items.forEach(item => {
                        html += `
                            <div class="bg-white rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition overflow-hidden flex flex-col relative group">
                                <div class="p-5 flex-1">
                                    <div class="flex justify-between items-start mb-2">
                                        <h4 class="text-lg font-bold text-ink pr-2">${item.name}</h4>
                                        <div class="text-right shrink-0">
                                            ${item.priceM ? `<div class="text-matcha-dark font-bold text-sm">M: $${item.priceM}</div>` : ''}
                                            ${item.priceL ? `<div class="text-matcha-dark font-bold text-sm">L: $${item.priceL}</div>` : ''}
                                            ${(!item.priceM && !item.priceL && item.price) ? `<div class="text-matcha-dark font-bold text-sm">$${item.price}</div>` : ''}
                                        </div>
                                    </div>
                                    ${item.description ? `<p class="text-sm text-gray-500 mt-2">${item.description}</p>` : ''}
                                </div>
                                <div class="bg-gray-50 p-3 border-t">
                                    <button onclick="openCustomizeModal('${item.id}', '${item.name}', ${item.priceM || 0}, ${item.priceL || 0}, ${item.price || 0})" class="w-full bg-white border border-matcha text-matcha py-2 rounded hover:bg-matcha hover:text-white transition font-bold group-hover:bg-matcha group-hover:text-white"><i class="fa-solid fa-plus mr-1"></i> 選擇甜度冰塊</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }
            }
            container.innerHTML = html;
        }

        window.showImageModal = (url) => {
            showModal('菜單預覽', `<img src="${url}" class="w-full rounded" style="max-height: 70vh; object-fit: contain;">`);
        };

        window.handleMenuLink = (url) => {
            const isImg = url.match(/\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i) || url.startsWith('data:image') || url.includes('alt=media');
            if (isImg) showImageModal(url);
            else window.open(url, '_blank');
        };

        window.showCampaignOrdersModal = () => {
            const currentOrders = state.orders.filter(o => o.campaignTitle === state.campaign.title && o.shopId === state.campaign.activeShopId);

            if (currentOrders.length === 0) {
                showModal('本團訂購進度', '<div class="text-center py-6 text-gray-500"><i class="fa-solid fa-inbox text-4xl mb-3"></i><p>目前還沒有人訂購喔！趕快搶頭香吧！</p></div>', null, false, '關閉', 'hidden');
                return;
            }

            let html = `<div class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">`;
            currentOrders.forEach(order => {
                const statusColors = { pending: 'bg-yellow-100 text-yellow-800', completed: 'bg-green-100 text-green-800', cancelled: 'bg-red-100 text-red-800' };
                const statusNames = { pending: '製作中', completed: '已完成', cancelled: '已取消' };

                let itemsHtml = order.items.map(i => {
                    let vText = '';
                    if(i.ice && i.sugar) {
                        vText = `${i.size !== '預設' ? i.size + '杯, ' : ''}${i.ice}, ${i.sugar}`;
                        if (i.topping && i.topping !== '無') vText += `, +${i.topping}`;
                    } else if (i.size && i.size !== '預設') {
                        vText = `${i.size}杯`;
                    }
                    return `<div class="flex justify-between text-sm border-b border-dashed border-gray-200 last:border-0 py-1.5">
                                <div><span class="font-bold text-ink">${i.name}</span> ${vText ? `<div class="text-xs text-gray-500">${vText}</div>` : ''}</div>
                                <span class="text-gray-600 ml-2 whitespace-nowrap mt-0.5">x${i.qty}</span>
                            </div>`;
                }).join('');

                html += `
                    <div class="border rounded-lg p-3 shadow-sm bg-gray-50">
                        <div class="flex justify-between items-center mb-2 border-b border-gray-200 pb-2">
                            <h4 class="font-bold text-ink text-base"><i class="fa-solid fa-user text-matcha mr-1"></i> ${order.customerName}</h4>
                            <span class="text-xs px-2 py-1 rounded font-bold ${statusColors[order.status] || 'bg-gray-100'}">${statusNames[order.status] || order.status}</span>
                        </div>
                        <div class="mb-2 bg-white p-2 rounded border border-gray-100">
                            ${itemsHtml}
                        </div>
                        <div class="text-right text-sm font-bold text-matcha-dark mt-1">
                            總計: $${order.totalAmount}
                        </div>
                    </div>

        // ==========================================
        // 7. Cart & Ordering Logic & LINE Notify
        // ==========================================
        window.addToCart = (id, name, basePrice, size, ice, sugar, topping, toppingPrice) => {
            const finalPrice = basePrice + toppingPrice;
            const cartKey = `${id}-${size}-${ice}-${sugar}-${topping}`;
            const existing = state.cart.find(item => item.cartKey === cartKey);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({ cartKey, id, name, price: finalPrice, qty: 1, size, ice, sugar, topping });
            }
            updateCartUI();
            
            const badge = document.getElementById('cart-badge');
            badge.classList.add('scale-150');
            setTimeout(() => badge.classList.remove('scale-150'), 200);
        };

        window.updateCartQty = (index, delta) => {
            state.cart[index].qty += delta;
            if (state.cart[index].qty <= 0) state.cart.splice(index, 1);
            updateCartUI();
        };

        function updateCartUI() {
            const cartItemsEl = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');

            const totalQty = state.cart.reduce((sum, item) => sum + item.qty, 0);
            if (totalQty > 0) {
                badge.textContent = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (state.cart.length === 0) {
                cartItemsEl.innerHTML = `<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-basket-shopping text-4xl mb-3"></i><p>購物車是空的</p></div>`;
                totalEl.textContent = `$0`;
                return;
            }

            let total = 0;
            cartItemsEl.innerHTML = state.cart.map((item, index) => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                
                let variantText = `${item.size !== '預設' ? item.size + '杯, ' : ''}${item.ice || '預設'}, ${item.sugar || '預設'}`;
                if (item.topping && item.topping !== '無') variantText += `, +${item.topping}`;
                
                return `
                    <div class="bg-white p-3 rounded shadow-sm border border-gray-100 flex justify-between items-center">
                        <div class="flex-1 pr-2">
                            <h4 class="font-bold text-ink text-sm sm:text-base">${item.name}</h4>
                            <div class="text-xs text-gray-500 mt-0.5">${variantText}</div>
                            <div class="text-matcha-dark font-bold text-sm mt-1">$${item.price}</div>
                        </div>
                        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                            <button onclick="updateCartQty(${index}, -1)" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center transition"><i class="fa-solid fa-minus text-xs"></i></button>
                            <span class="w-4 text-center font-bold text-ink">${item.qty}</span>
                            <button onclick="updateCartQty(${index}, 1)" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-matcha-light text-white hover:bg-matcha flex items-center justify-center transition"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.textContent = `$${total}`;
        }

        window.toggleCart = () => {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        // --- LINE Notify 輔助函數 ---
        const sendLineNotify = (order) => {
            const token = 'slJRvHrUnyBVS8ETTZHCSt-0GkqK-zBC';
            
            // 組合要推播的訊息內容
            let msg = `\n🔔 【新訂單通知】\n`;
            msg += `👤 訂購人：${order.customerName}\n`;
            msg += `🏪 店家：${order.shopName}\n`;
            if (order.notes) msg += `📝 備註：${order.notes}\n`;
            msg += `💰 總金額：$${order.totalAmount}\n`;
            msg += `--- 訂購明細 ---\n`;
            
            order.items.forEach(item => {
                let vText = [];
                if (item.size && item.size !== '預設') vText.push(item.size + '杯');
                if (item.ice) vText.push(item.ice);
                if (item.sugar) vText.push(item.sugar);
                if (item.topping && item.topping !== '無') vText.push('+' + item.topping);
                
                const variantStr = vText.length > 0 ? ` (${vText.join(', ')})` : '';
                msg += `• ${item.name}${variantStr} x${item.qty}\n`;
            });

            // 呼叫您提供的 API Endpoint
            const url = `https://v2.chateverywhere.app/api/line/notify?token=${token}&message=${encodeURIComponent(msg)}`;
            
            // 使用 fetch 送出請求 (這裡不使用 await 避免卡住前端畫面)
            fetch(url).catch(err => console.error('LINE Notify 發送失敗:', err));
        };

        window.submitOrder = async () => {
            if (state.cart.length === 0) return showModal('提示', '購物車是空的！');
            
            if (!state.campaign || !state.campaign.isActive) {
                return showModal('無法訂購', '目前訂購任務已結束！');
            }

            const shop = state.shops.find(s => s.id === state.campaign.activeShopId);
            if (!shop) return showModal('無法訂購', '店家資料異常！');

            const name = document.getElementById('order-customer-name').value.trim();
            if (!name) return showModal('提示', '請輸入您的姓名或暱稱！');
            
            const notes = document.getElementById('order-customer-notes').value.trim();
            const total = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const orderData = {
                shopId: shop.id,
                shopName: shop.name,
                campaignTitle: state.campaign.title,
                customerName: name,
                notes: notes,
                items: [...state.cart],
                totalAmount: total,
                status: 'pending',
                createdAt: serverTimestamp()
            };

            try {
                showModal('處理中', '<div class="text-center py-6"><div class="loader mx-auto mb-4"></div><p>正在送出訂單...</p></div>');
                
                // 1. 寫入訂單到資料庫
                await addDoc(collection(db, PATH_ORDERS), orderData);
                
                // 2. 觸發 LINE Notify 推播通知
                sendLineNotify(orderData);

                // 3. 清理購物車並更新畫面
                state.cart = [];
                updateCartUI();
                document.getElementById('order-customer-notes').value = '';
                toggleCart();
                
                showModal('訂購成功', `<div class="text-center"><i class="fa-solid fa-circle-check text-5xl text-matcha mb-4"></i><p class="text-lg">您的訂單已送出！</p><p class="text-sm text-gray-500 mt-2">店家準備中，請稍候。</p></div>`);

            csvContent += "訂單時間,任務主題,店家名稱,訂購人(暱稱),訂單狀態,總金額,顧客備註,飲品明細\n";

            orders.forEach(order => {
                const date = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleString('zh-TW', {hour12: false}) : '無日期';
                const campaign = `"${(order.campaignTitle || '').replace(/"/g, '""')}"`;
                const shop = `"${(order.shopName || '').replace(/"/g, '""')}"`;
                const customer = `"${(order.customerName || '').replace(/"/g, '""')}"`;
                
                const statusNames = { pending: '製作中', completed: '已完成', cancelled: '已取消' };
                const status = statusNames[order.status] || order.status;
                const total = order.totalAmount;
                const notes = `"${(order.notes || '').replace(/"/g, '""')}"`;

                const itemsStr = order.items.map(i => {
                    let vText = '';
                    if(i.ice && i.sugar) {

                csvContent += `${date},${campaign},${shop},${customer},${status},${total},${notes},${items}\n`;

        // 統一取得過濾後的訂單資料
        function getFilteredOrders() {
            let filteredOrders = state.orders;

            if (state.orderFilterShopId !== 'all') {
                filteredOrders = filteredOrders.filter(o => o.shopId === state.orderFilterShopId);
            }

            if (state.orderFilterStartDate) {
                const startTime = new Date(state.orderFilterStartDate + 'T00:00:00').getTime();
                filteredOrders = filteredOrders.filter(o => {
                    if (!o.createdAt) return false;
                    const orderTime = o.createdAt.toMillis ? o.createdAt.toMillis() : o.createdAt.getTime();
                    return orderTime >= startTime;
                });
            }

            if (state.orderFilterEndDate) {
                const endTime = new Date(state.orderFilterEndDate + 'T23:59:59').getTime();
                filteredOrders = filteredOrders.filter(o => {
                    if (!o.createdAt) return false;
                    const orderTime = o.createdAt.toMillis ? o.createdAt.toMillis() : o.createdAt.getTime();
                    return orderTime <= endTime;
                });
            }
            
            return filteredOrders;
        }

            const orders = getFilteredOrders();
            if (orders.length === 0) return alert('目前篩選條件下沒有訂單可供匯出！');

            // 加上 UTF-8 BOM，讓 Excel 用 UTF-8 正確讀取中文
            let csvContent = "\uFEFF"; 
            csvContent += "訂單時間,任務主題,店家名稱,訂購人(暱稱),訂單狀態,總金額,顧客備註,飲品明細\n";

                const campaign = `"${(order.campaignTitle || '').replace(/"/g, '""')}"`;
                const shop = `"${(order.shopName || '').replace(/"/g, '""')}"`;
                const customer = `"${(order.customerName || '').replace(/"/g, '""')}"`;
                
                const statusNames = { pending: '製作中', completed: '已完成', cancelled: '已取消' };
                const status = statusNames[order.status] || order.status;
                const total = order.totalAmount;
                const notes = `"${(order.notes || '').replace(/"/g, '""')}"`;

                // 整理品項明細為單行文字
                const itemsStr = order.items.map(i => {
                    let vText = '';
                    if(i.ice && i.sugar) {
                        vText = `${i.size !== '預設' ? i.size + '杯, ' : ''}${i.ice}, ${i.sugar}`;
                        if (i.topping && i.topping !== '無') vText += `, +${i.topping}`;
                    } else if (i.size && i.size !== '預設') {
                        vText = `${i.size}杯`;
                    }
                    return `${i.name}${vText ? `(${vText})` : ''} x${i.qty}`;
                }).join('； ');
                const items = `"${itemsStr}"`;

                csvContent += `${date},${campaign},${shop},${customer},${status},${total},${notes},${items}\n`;
            });

            // 建立下載連結
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `訂單匯出明細_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

                html += `

            showModal(id ? '編輯飲品' : '新增飲品', html, async () => {

                <div class="space-y-4">

                        <button onclick="startScanFromFile()" class="w-full bg-white border-2 border-purple-300 text-purple-700 py-3 rounded shadow-sm hover:bg-purple-50 transition font-bold flex items-center justify-center gap-2"><i class="fa-solid fa-upload"></i> 從電腦 / 手機上傳圖片檔案</button>

        window.startScanFromFile = () => { tempScanShopId = document.getElementById('ai-scan-shop').value; closeModal(); document.getElementById('ai-menu-upload').click(); };
        window.startScanFromUrl = async () => {

            try {
                let response;
                try { response = await fetch(url); if (!response.ok) throw new Error('Direct fetch failed'); } 
                catch (e) { response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`); if (!response.ok) throw new Error('Proxy fetch failed'); }
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onloadend = () => executeAIScan(reader.result, blob.type || 'image/jpeg');

            } catch (error) { showModal('錯誤', '<div class="text-center text-red-500"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p>無法讀取該網址的圖片。</p><p class="text-sm mt-2 text-gray-500">可能原因：網址無效，或網站防盜鏈阻擋存取。請將圖片下載到裝置後，改用「上傳圖片檔案」方式掃描。</p></div>'); }

        window.processMenuImage = async (event) => {

        };

        window.executeAIScan = async (base64Data, mimeType) => {
            const customKey = localStorage.getItem('custom_gemini_key');
            const modeText = customKey ? '(目前狀態：使用自訂金鑰)' : '(目前狀態：使用系統內建金鑰)';
            showModal('AI 辨識中', `<div class="text-center py-10"><i class="fa-solid fa-wand-magic-sparkles text-5xl text-purple-500 mb-6 animate-pulse"></i><h3 class="text-xl font-bold text-gray-800 mb-2">正在解析菜單內容...</h3><p class="text-gray-500 text-sm mb-3">呼叫 Gemini AI 視覺模型中，大約需要 5-10 秒鐘。</p><span class="text-xs bg-gray-100 border border-gray-200 text-gray-500 px-3 py-1.5 rounded-full">${modeText}</span></div>`);
            
            try {
                const apiKey = "";
                const finalKey = customKey || apiKey;
                // Updated to use the recommended gemini-3.6-flash model
                const modelVersion = 'gemini-3.6-flash';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelVersion}:generateContent?key=${finalKey}`;
                const prompt = "你是一個專業的資料輸入員。請從這張菜單圖片中提取所有飲料品項。如果有分中杯(M)和大杯(L)的價格，請分別填寫對應的數字。如果飲料只有單一價格，請將價格填入 priceL 欄位中。如果是空菜單請回傳空陣列。";
                
                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: mimeType, data: base64Data.split(',')[1] } }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        // Replaced deprecated sampling parameters with the new thinking_level
                        thinking_level: "low",
                        responseSchema: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    name: { type: "STRING" },
                                    priceM: { type: "INTEGER", description: "中杯價格，若無請留空或設為0" },
                                    priceL: { type: "INTEGER", description: "大杯價格或單一價格" },
                                    category: { type: "STRING" }
                                }
                            }
                        }
                    }
                };

                const fetchWithBackoff = async (url, options, retries = 5) => {
                    const delays = [1000, 2000, 4000, 8000, 16000];
                    for (let i = 0; i <= retries; i++) {
                        try {
                            const response = await fetch(url, options);
                            if (!response.ok) {
                                const errorData = await response.json().catch(() => ({}));
                                const errMsg = errorData.error?.message || `HTTP 錯誤碼: ${response.status}`;
                                if ((response.status === 429 || response.status >= 500) && i < retries) {
                                    await new Promise(res => setTimeout(res, delays[i]));
                                    continue;
                                }
                                throw new Error(errMsg);
                            }
                            return response;
                        } catch (err) {
                            if (i === retries) throw err;
                            await new Promise(res => setTimeout(res, delays[i]));
                        }
                    }
                };

                const response = await fetchWithBackoff(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    const candidate = result.candidates[0];
                    if (candidate.finishReason !== "STOP" && candidate.finishReason) throw new Error(`AI 拒絕生成或被中斷 (原因碼: ${candidate.finishReason})`);
                    const jsonText = candidate.content?.parts?.[0]?.text || "[]";
                    let items = [];
                    try { items = JSON.parse(jsonText); } 
                    catch (e) { throw new Error("AI 回傳的資料格式異常，無法轉換為表格。"); }
                    renderScannedPreview(items);
                } else { throw new Error('API 回應成功但沒有提供任何辨識內容。'); }

            } catch (error) {
                console.error("AI Scan Error:", error);
                let displayError = error.message;
                if (displayError.includes('denied access')) displayError = `<b>專案被拒絕存取 (Denied Access)</b><br><br>這代表您填寫的「自訂 API Key」對應的 Google 帳號權限異常。<br><br>💡 <b>解決方案：</b>請前往左側「個人設定」，將 API Key 欄位<b>完全清空（不要留空格）</b>後點擊儲存，切換回內建金鑰再試一次！`;
                else if (displayError.includes('unregistered callers') || displayError.includes('API_KEY_INVALID')) displayError = `缺少有效的 API Key。請確認環境金鑰 ক্যাম入，或至「個人設定」重新填寫有效的金鑰。`;
                showModal('掃描失敗', `<div class="text-center py-6 text-red-500"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p class="text-lg font-bold mb-2">無法辨識菜單圖片</p><div class="bg-red-50 p-4 rounded text-sm text-left border border-red-200 text-red-800 max-h-48 overflow-y-auto w-full break-words">${displayError}</div></div>`);
            }
        };

        window.renderScannedPreview = (items) => {
            if (!Array.isArray(items) || items.length === 0) return showModal('掃描結果', '未能從圖片中找到任何飲品品項，請確認上傳的圖片是菜單。');
            let html = `
                <div class="mb-3 text-sm text-gray-600 bg-yellow-50 p-2 rounded border border-yellow-200"><i class="fa-solid fa-circle-info"></i> AI 已成功擷取 <b>${items.length}</b> 個品項。您可以直接點擊下方表格修改錯字或價格，確認無誤後點擊匯入。</div>

            `;
            items.forEach((item, idx) => {
                html += `<tr id="scan-row-${idx}" class="hover:bg-gray-50 border-b last:border-0 group"><td class="p-1"><input type="text" class="w-full p-1 border border-transparent hover:border-gray-300 focus:border-purple-500 bg-transparent rounded text-xs outline-none" id="scan-cat-${idx}" value="${item.category || '未分類'}"></td><td class="p-1"><input type="text" class="w-full p-1 border border-transparent hover:border-gray-300 focus:border-purple-500 bg-transparent rounded text-sm font-bold outline-none" id="scan-name-${idx}" value="${item.name}"></td><td class="p-1"><input type="number" class="w-full p-1 border border-transparent hover:border-gray-300 focus:border-purple-500 bg-transparent rounded text-sm outline-none text-center" id="scan-price-m-${idx}" value="${item.priceM || ''}"></td><td class="p-1"><input type="number" class="w-full p-1 border border-transparent hover:border-gray-300 focus:border-purple-500 bg-transparent rounded text-sm outline-none text-center" id="scan-price-l-${idx}" value="${item.priceL || item.price || ''}"></td><td class="p-1 text-center"><button onclick="document.getElementById('scan-row-${idx}').remove()" class="text-gray-300 hover:text-red-500 transition px-2"><i class="fa-solid fa-xmark"></i></button></td></tr>`;
            });
            showModal('請確認辨識結果', html + `</tbody></table></div>`, () => {
                const finalItems = [];
                document.getElementById('scanned-items-tbody').querySelectorAll('tr').forEach(row => {
                    const idx = row.id.split('-')[2];
                    const cat = document.getElementById(`scan-cat-${idx}`).value.trim();
                    const name = document.getElementById(`scan-name-${idx}`).value.trim();
                    const priceM = parseInt(document.getElementById(`scan-price-m-${idx}`).value) || 0;
                    const priceL = parseInt(document.getElementById(`scan-price-l-${idx}`).value) || 0;
                    if (name && (priceM > 0 || priceL > 0)) finalItems.push({ category: cat, name, priceM, priceL, shopId: tempScanShopId, isAvailable: true, description: '' });
                });
                if (finalItems.length === 0) return showModal('提示', '沒有有效的品項可以新增。');
                showModal('儲存中', '<div class="text-center py-8"><div class="loader mx-auto mb-4"></div><p>正在將品項寫入資料庫...</p></div>');
                setTimeout(async () => {
                    try {
                        await Promise.all(finalItems.map(item => addDoc(collection(db, PATH_MENUS), item)));
                        showModal('匯入成功', `<div class="text-center"><i class="fa-solid fa-circle-check text-5xl text-matcha mb-4"></i><p class="text-lg">太棒了！已成功匯入 <b>${finalItems.length}</b> 個品項！</p></div>`);
                    } catch (e) { showModal('錯誤', '部分品項儲存失敗。'); }
                }, 500);
            }, true, '確認並匯入資料', 'bg-purple-600 hover:bg-purple-700');
        };

        // --- Admin: Accounts & Settings ---
        function renderAdminAccounts() {
            if (state.adminUser.role !== 'super_admin') return `<p class="text-red-500">權限不足</p>`;
            let html = `<div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold font-serif text-ink border-l-4 border-matcha pl-3">帳號管理 (Super Admin)</h2><button onclick="openAccountForm()" class="bg-ink text-white px-4 py-2 rounded shadow hover:bg-gray-800 flex items-center gap-2 transition"><i class="fa-solid fa-user-plus"></i> 新增管理員</button></div><div class="bg-gray-50 border rounded-lg overflow-hidden shadow-sm"><table class="w-full text-left"><thead class="bg-gray-200 text-gray-700"><tr><th class="p-3">帳號</th><th class="p-3">密碼</th><th class="p-3">權限角色</th><th class="p-3 text-center">操作</th></tr></thead><tbody class="divide-y divide-gray-200 bg-white">`;

        window.openAccountForm = (id = null) => {
            const acc = id ? state.admins.find(a => a.id === id) : { username: '', password: '', role: 'admin' };
            const html = `
                <div class="space-y-4">
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">登入帳號 *</label><input type="text" id="acc-user" class="w-full border p-2 rounded focus:border-matcha focus:outline-none" value="${acc.username}"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">登入密碼 *</label><input type="text" id="acc-pass" class="w-full border p-2 rounded focus:border-matcha focus:outline-none" value="${acc.password}"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">權限角色</label><select id="acc-role" class="w-full border p-2 rounded focus:border-matcha focus:outline-none bg-white"><option value="admin" ${acc.role === 'admin' ? 'selected' : ''}>一般管理員 (僅管訂單、菜單)</option><option value="super_admin" ${acc.role === 'super_admin' ? 'selected' : ''}>Super Admin (可管理帳號)</option></select></div>
                </div>
            `;
            showModal(id ? '編輯管理員' : '新增管理員', html, async () => {
                const data = { username: document.getElementById('acc-user').value.trim(), password: document.getElementById('acc-pass').value.trim(), role: document.getElementById('acc-role').value };
                if (!data.username || !data.password) return alert('帳號密碼不可為空');
                try { if (id) await updateDoc(doc(db, PATH_ADMINS, id), data); else await addDoc(collection(db, PATH_ADMINS), data); } catch (e) { alert('儲存失敗'); }
            }, true);
        };
        window.deleteAccount = async (id) => { if(confirm('確定要刪除此帳號嗎？')) { try { await deleteDoc(doc(db, PATH_ADMINS, id)); } catch (e) { alert('刪除失敗'); } } };

        function renderAdminSettings() {
            return `
                <h2 class="text-2xl font-bold font-serif mb-6 text-ink border-l-4 border-matcha pl-3">系統與個人設定</h2>
                <div class="max-w-md bg-white p-6 rounded-lg border border-gray-200 shadow-sm mb-6"><h3 class="font-bold text-lg mb-4 text-gray-700"><i class="fa-solid fa-store mr-2 text-matcha"></i>系統名稱設定</h3><div class="space-y-4"><div><label class="block text-sm font-bold text-gray-600 mb-1">網站首頁名稱</label><input type="text" id="setting-site-name" class="w-full border p-2 rounded focus:outline-none focus:border-matcha bg-gray-50" value="${state.siteName}"></div><button onclick="saveSiteName()" class="w-full bg-matcha text-white py-2 rounded shadow hover:bg-matcha-dark transition font-bold">更新網站名稱</button></div></div>
                <div class="max-w-md bg-gray-50 p-6 rounded-lg border border-gray-200 shadow-sm mb-6"><h3 class="font-bold text-lg mb-4 text-gray-700"><i class="fa-solid fa-key mr-2"></i>修改我的密碼</h3><div class="space-y-4"><div><label class="block text-sm font-bold text-gray-600 mb-1">新密碼</label><input type="password" id="setting-new-pass" class="w-full border p-2 rounded focus:outline-none focus:border-matcha bg-white"></div><button onclick="changeMyPassword()" class="w-full bg-gray-800 text-white py-2 rounded shadow hover:bg-black transition font-bold">儲存新密碼</button></div></div>
                <div class="max-w-md bg-purple-50 p-6 rounded-lg border border-purple-200 shadow-sm"><h3 class="font-bold text-lg mb-2 text-purple-800"><i class="fa-solid fa-robot mr-2"></i>AI 辨識金鑰設定 (外部環境專用)</h3><p class="text-xs text-purple-600 mb-4">若遇到「無法辨識」或無權限錯誤，請到 Google AI Studio 免費申請 API Key 並填寫於此。</p><div class="space-y-4"><div><input type="password" id="setting-api-key" class="w-full border p-2 rounded focus:outline-none focus:border-purple-400 bg-white" value="${localStorage.getItem('custom_gemini_key') || ''}" placeholder="AIzaSy..."></div><button onclick="saveApiKey()" class="w-full bg-purple-600 text-white py-2 rounded shadow hover:bg-purple-700 transition font-bold">儲存 API Key</button></div></div>
            `;
        }

        window.saveSiteName = async () => {
            const newName = document.getElementById('setting-site-name').value.trim();
            if (!newName) return alert('網站名稱不可為空');
            try { await setDoc(doc(db, PATH_SETTINGS, 'general'), { name: newName }, { merge: true }); alert('網站名稱已成功更新！'); } catch (e) { alert('更新失敗'); }
        };

        window.saveApiKey = () => {
            const key = document.getElementById('setting-api-key').value.trim();
            if(key) { localStorage.setItem('custom_gemini_key', key); alert('API Key 已儲存至瀏覽器！'); } 
            else { localStorage.removeItem('custom_gemini_key'); alert('API Key 已清除。'); }
        };

        window.changeMyPassword = async () => {
            const newPass = document.getElementById('setting-new-pass').value.trim();
            if (!newPass || newPass.length < 4) return alert('密碼太短');
            try { await updateDoc(doc(db, PATH_ADMINS, state.adminUser.id), { password: newPass }); state.adminUser.password = newPass; alert('密碼修改成功！'); document.getElementById('setting-new-pass').value = ''; } catch (e) { alert('修改失敗'); }
        };

        // ==========================================
        // 9. Utility UI Functions (Modal)
        // ==========================================
        let currentModalConfirmCallback = null;
        let keepModalOpenFlag = false;

        window.showModal = (title, htmlBody, confirmCallback = null, showCancel = false, confirmText = '確定', confirmBtnClass = '') => {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = htmlBody;
            const cancelBtn = document.getElementById('modal-cancel-btn');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            showCancel ? cancelBtn.classList.remove('hidden') : cancelBtn.classList.add('hidden');
            confirmBtn.textContent = confirmText;
            confirmBtn.className = `px-4 py-2 text-white rounded transition shadow ${confirmBtnClass || 'bg-matcha hover:bg-matcha-dark'}`;
            currentModalConfirmCallback = confirmCallback;
            keepModalOpenFlag = false;
            document.getElementById('global-modal').classList.remove('hidden');
        };

        window.closeModal = () => { document.getElementById('global-modal').classList.add('hidden'); currentModalConfirmCallback = null; };
        document.getElementById('modal-confirm-btn').addEventListener('click', () => { if (currentModalConfirmCallback) currentModalConfirmCallback(); if (!keepModalOpenFlag) closeModal(); });

    </script>
</body>
</html>
